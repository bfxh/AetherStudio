name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Check formatting
        run: cargo fmt --check
      
      - name: Run cargo check
        run: cargo check
      
      - name: Run tests
        run: cargo test

  mcp-servers-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest and httpx
        run: python -m pip install pytest httpx

      # 子模块含同名测试文件（test_server.py 等），根目录一次收集会 import 冲突，
      # 因此按目录逐个运行（与 mcp-servers/README.md 的验证方式一致）。
      - name: Run MCP servers tests (per-directory)
        shell: pwsh
        run: |
          $dirs = @('unified', 'code-analysis-enhance', 'pr-oracle', 'ci-optimization', 'tautest')
          foreach ($d in $dirs) {
            Write-Host "=== $d ==="
            python -m pytest "mcp-servers/$d" -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
